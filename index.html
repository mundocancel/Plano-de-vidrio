<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plano de Vidrio — Estilo Cuaderno Técnico</title>
  
  <style>
    /* ==========================================================================
       1. VARIABLES: CUADERNO DE DIBUJO TÉCNICO (CAD / BLUEPRINT)
       ========================================================================== */
    :root {
      /* Paleta Cuaderno Técnico Azul Industrial */
      --color-fondo: #0d1b2a;         /* Azul noche de fondo general */
      --color-tarjeta: #1b263b;       /* Panel de controles y hoja */
      --color-grid: rgba(65, 90, 119, 0.35); /* Lineas de cuadrícula */
      
      --color-primario: #00b4d8;      /* Cyan de cota/trazo principal */
      --color-primario-hover: #90e0ef;
      --color-secundario: #415a77;    /* Gris azulado bordes/secundarios */
      
      --color-texto: #e0e1dd;         /* Texto claro de lectura */
      --color-texto-suave: #778da9;   /* Acotaciones y notas secundarias */
      --color-acento: #ff4d6d;        /* Perforaciones, resaqués y alertas */
      --color-vidrio: rgba(0, 180, 216, 0.12); /* Tono cristal sobre cuadrícula */

      /* Tipografía Técnica */
      --fuente: "Consolas", "Courier New", "Fira Code", monospace;
      --fuente-ui: "Segoe UI", system-ui, sans-serif;
      
      --radio: 4px;                   /* Bordes rectos tipo plantilla */
      --sombra: 0 4px 20px rgba(0, 0, 0, 0.5);
      --ancho-panel: 340px;
      --espacio: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Fondo general con trama de cuadrícula milimétrica */
    body {
      font-family: var(--fuente);
      background-color: var(--color-fondo);
      background-image: 
        linear-gradient(var(--color-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--color-grid) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--color-texto);
      line-height: 1.4;
    }

    .wrap {
      display: flex;
      gap: var(--espacio);
      padding: var(--espacio);
      align-items: flex-start;
    }

    /* ==========================================================================
       2. CONTROLES Y FORMULARIO (ESTILO HERRAMIENTA TÉCNICA)
       ========================================================================== */
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 10px 0 3px;
      color: var(--color-texto-suave);
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--color-secundario);
      border-radius: var(--radio);
      font-size: 12px;
      font-family: var(--fuente);
      background: rgba(13, 27, 42, 0.8);
      color: var(--color-primario);
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--color-primario);
      box-shadow: 0 0 8px rgba(0, 180, 216, 0.4);
    }

    textarea {
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--color-primario);
      border-radius: var(--radio);
      background: rgba(0, 180, 216, 0.15);
      color: var(--color-primario);
      font-size: 12px;
      font-family: var(--fuente);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all .15s;
    }

    button:hover { 
      background: var(--color-primario); 
      color: var(--color-fondo);
      box-shadow: 0 0 12px rgba(0, 180, 216, 0.5);
    }
    
    button:active { transform: scale(0.98); }

    button.gray { 
      border-color: var(--color-secundario);
      background: rgba(65, 90, 119, 0.2);
      color: var(--color-texto);
    }
    button.gray:hover { 
      background: var(--color-secundario);
      color: #fff;
    }

    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    .hint { font-size: 10px; color: var(--color-texto-suave); margin-top: 4px; }

    /* ==========================================================================
       3. CONTENEDORES (PANEL & ÁREA DE DIBUJO)
       ========================================================================== */
    .panel {
      width: var(--ancho-panel);
      background: var(--color-tarjeta);
      border: 1px solid var(--color-secundario);
      border-radius: var(--radio);
      padding: var(--espacio);
      box-shadow: var(--sombra);
    }

    .panel h1 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--color-primario);
      border-bottom: 1px dashed var(--color-secundario);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .panel h1::before {
      content: "📐 [CAD] ";
    }

    #hoja {
      flex: 1;
      background: var(--color-tarjeta);
      border: 1px solid var(--color-secundario);
      border-radius: var(--radio);
      padding: 16px;
      box-shadow: var(--sombra);
      min-width: 0;
      /* Cuadrícula interna más fina para la hoja de plano */
      background-image: 
        linear-gradient(rgba(65, 90, 119, 0.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(65, 90, 119, 0.2) 1px, transparent 1px);
      background-size: 10px 10px;
    }

    #cajon svg {
      width: 100%;
      height: auto;
      display: block;
      /* Aplica estilo técnico a las líneas vectoriales generadas */
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Estilos para tablas de datos de perforaciones y cotas */
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 11px;
      margin-top: 12px;
      background: rgba(13, 27, 42, 0.5);
    }

    td, th {
      border: 1px solid var(--color-secundario);
      padding: 6px 8px;
      text-align: left;
    }

    th {
      background: rgba(65, 90, 119, 0.3);
      color: var(--color-primario);
      text-transform: uppercase;
    }

    @media (max-width: 768px) {
      .wrap { flex-direction: column; }
      .panel { width: 100%; }
    }

    /* ==========================================================================
       4. REGLAS DE IMPRESIÓN (MEMBRETE INDUSTRIAL)
       ========================================================================== */
    @media print {
      @page { size: A4 portrait; margin: 8mm; }

      body { 
        background: #ffffff !important; 
        color: #000000 !important;
      }
      
      .panel { display: none !important; }

      .wrap { padding: 0; gap: 0; }

      #hoja {
        box-shadow: none;
        border: 2px solid #000;
        border-radius: 0;
        width: 100%;
        padding: 10mm;
        background: #fff !important;
      }

      #hoja::before {
        content: "MUNDOCANCEL — PLANO TÉCNICO DE VIDRIO TEMPLADO";
        display: block;
        font-family: var(--fuente);
        font-size: 14pt;
        font-weight: bold;
        border-bottom: 2px solid #000;
        padding-bottom: 4px;
        margin-bottom: 12px;
        color: #000;
      }

      table { border-color: #000; }
      td, th { border-color: #000; color: #000; }
      th { background: #eee !important; }
      #cajon svg { page-break-inside: avoid; }
    }
  </style>
</head>
<body>

  <div class="wrap">
    <!-- PANEL LATERAL DE ESPECIFICACIONES -->
    <aside class="panel">
      <h1>Plano de Vidrio</h1>
      
      <label for="plantilla">Tipo de Pieza</label>
      <select id="plantilla">
        <option value="libre">✏️ Libre / personalizado</option>
        <option value="pbis" selected>🚪 Puerta de baño (bisagras + manillón)</option>
        <option value="pcorr">↔️ Puerta corrediza de baño (kit riel)</option>
        <option value="fijo">🧱 Fijo de cancel (conectores)</option>
        <option value="barandal">🛡️ Fijo barandal (sin mecanizados)</option>
      </select>
      <div class="hint">Tolerancia taller: +/- 1.0 mm</div>

      <div class="row" style="margin-top: 10px;">
        <div>
          <label for="ancho">Ancho (mm)</label>
          <input type="number" id="ancho" value="800" placeholder="000">
        </div>
        <div>
          <label for="alto">Alto (mm)</label>
          <input type="number" id="alto" value="2000" placeholder="000">
        </div>
      </div>

      <div class="row">
        <div>
          <label for="espesor">Espesor</label>
          <select id="espesor">
            <option>6 mm</option>
            <option>8 mm</option>
            <option selected>10 mm</option>
            <option>12 mm</option>
          </select>
        </div>
        <div>
          <label for="acabado">Sustrato</label>
          <select id="acabado">
            <option selected>Claro</option>
            <option>Gris</option>
            <option>Bronce</option>
            <option>Extra claro</option>
          </select>
        </div>
      </div>

      <label for="tipo-canto">Tratamiento de Canto</label>
      <select id="tipo-canto">
        <option selected>Pulido (resaque de cantos)</option>
        <option>Pulido fino</option>
        <option>Biselado</option>
        <option>Corte crudo</option>
      </select>

      <div style="margin-top: 18px;" class="row">
        <button type="button">Renderizar</button>
        <button type="button" class="gray" onclick="window.print()">Exportar PDF</button>
      </div>
    </aside>

    <!-- ÁREA DEL PLANO CON CUADRÍCULA -->
    <main id="hoja">
      <div id="cajon">
        <!-- El plano en SVG renderizado por JavaScript va aquí -->
      </div>
    </main>
  </div>

</body>
</html>
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plano de Vidrio Templado v2</title>
<style>
*{box-sizing:border-box}body{font-family:Segoe UI,Arial;margin:0;background:#eef1f5}
.wrap{display:flex;gap:14px;padding:14px;align-items:flex-start}
.panel{width:340px;background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 5px rgba(0,0,0,.12)}
.panel h1{font-size:16px;margin:0 0 8px}
label{display:block;font-size:11.5px;margin:7px 0 2px;color:#333}
input,select,textarea{width:100%;padding:6px;border:1px solid #b9c2cc;border-radius:6px;font-size:13px}
textarea{font-family:Consolas,monospace;font-size:12px}
.row{display:flex;gap:8px}.row>div{flex:1}
button{margin-top:8px;padding:9px 10px;border:0;border-radius:7px;background:#0b66c3;color:#fff;font-size:12.5px;cursor:pointer}
button.gray{background:#5b6673}button.green{background:#1d8a4a}
#hoja{flex:1;background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 5px rgba(0,0,0,.12)}
#cajon svg{width:100%;height:auto}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px}
td,th{border:1px solid #999;padding:4px 6px;text-align:left}th{background:#f0f3f7}
.hint{font-size:10.5px;color:#667;margin-top:4px}
@media print{.panel{display:none}.wrap{padding:0}#hoja{box-shadow:none;border-radius:0}}
</style>
</head>
<body>
<div class="wrap">
<div class="panel">
<h1>📐 Plano de templado v2</h1>
<label>🧩 Plantilla</label>
<select id="tpl">
<option value="libre">✏️ Libre / personalizado</option>
<option value="pbis" selected>🚪 Puerta de baño (bisagras + manillón)</option>
<option value="pcorr">↔️ Puerta corrediza de baño (kit riel)</option>
<option value="fijo">🧱 Fijo de cancel (conectores)</option>
<option value="barandal">🛡️ Fijo barandal (sin mecanizados)</option>
</select>
<div class="hint">Estándares: bisagras 228.6 (9") de extremos · manillón Ø12 a 76.2 (3"), inferior a 812.8 (32") · carretillas ø16/ø10 · conectores ø14/ø12.</div>
<label>💾 Guardados</label>
<select id="guardados" onchange="abrir(this.value)"><option value="">— Abrir pieza guardada —</option></select>
<label>Cliente / Obra</label><input id="cliente">
<div class="row"><div><label>Pieza</label><input id="pieza" value="V-01"></div>
<div><label>Cantidad</label><input id="cant" type="number" value="1"></div></div>
<div class="row"><div><label>Ancho (mm)</label><input id="ancho" type="number" value="650"></div>
<div><label>Alto (mm)</label><input id="alto" type="number" value="1900"></div></div>
<div class="row"><div><label>Espesor</label><select id="esp"><option>6 mm</option><option>8 mm</option><option selected>10 mm</option><option>12 mm</option></select></div>
<div><label>Color</label><select id="color"><option>Claro</option><option>Gris</option><option>Bronce</option><option>Extra claro</option></select></div></div>
<label>Cantos</label><select id="cantos"><option selected>Pulido (resaque de cantos)</option><option>Pulido fino</option><option>Biselado</option><option>Corte crudo</option></select>
<label>Perforaciones — X,Y,Ø (mm desde borde izq. e inferior)</label>
<textarea id="perf" rows="2"></textarea>
<label>Resaques — bisagra: B,D|I,T|B,dist,alto,prof,R · esquina: C,BI,ancho,alto</label>
<textarea id="mues" rows="2"></textarea>
<label>Herrajes sugeridos</label><textarea id="herr" rows="2"></textarea>
<label>Observaciones</label><textarea id="obs" rows="2"></textarea>
<button onclick="window.print()">🖨 Imprimir / PDF</button>
<button class="gray" onclick="dxf()">⬇ DXF</button>
<button class="green" onclick="guardar()">💾 Guardar</button>
</div>
<div id="hoja"><div id="cajon"></div><div id="tabla"></div></div>
</div>
<script>
const $=id=>document.getElementById(id), r1=x=>Math.round(x*10)/10;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const seg=(a,b,c,d,col='#111')=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${col}" stroke-width="1"/>`;
const tick=(x,y)=>seg(x-4,y+4,x+4,y-4);
const txt=(x,y,t,an='start',col='#111',rot=0)=>`<text x="${x}" y="${y}" font-size="12" fill="${col}" text-anchor="${an}" ${rot?`transform="rotate(${rot} ${x} ${y})"`:''}>${t}</text>`;
let tplActual='pbis';
function genTpl(k,W,H){
 const o={perf:[],mues:[],obs:'',herr:''};
 if(k==='pbis'){
  o.mues=['B,D,T,228.6,55,25,6','B,D,B,228.6,55,25,6'];
  o.perf=['76.2,812.8,12','76.2,1012.8,12'];
  o.obs='Puerta de baño con bisagras. Resaques con esquinas redondeadas R6. Cantos pulidos. Templado.';
  o.herr='2 bisagras 90° · Manillón JRCS ø46 · Sellos antiescurrimiento';
 }else if(k==='pcorr'){
  o.perf=[`60,${H-40},16`,`60,${H-85},10`,`${W-60},${H-40},16`,`${W-60},${H-85},10`];
  o.obs='Puerta corrediza de baño. Ancho = luz/2 + 50 mm. Botagua H-8 en canto de cierre. Guía inferior.';
  o.herr='Kit CBDS inox 304 satinado: carretillas, riel 30×10, soportes redondos, tope lateral, conector riel-muro, guía';
 }else if(k==='fijo'){
  o.perf=[`50,${H-40},14`,`${W-50},${H-40},14`,`50,60,12`,`${W-50},60,12`];
  o.obs='Fijo para cancel de baño. Conectores a muro / perfil H.';
  o.herr='Conectores CCM90AIC · Perfil H-8 · Empaques';
 }else if(k==='barandal'){
  o.obs='Fijo de barandal. Sin perforaciones ni resaques. Cantos pulidos.';
  o.herr='Soportes/conectores de piso según proyecto';
 }
 return o;
}
function aplicarTpl(k,conservar){
 if(k==='libre'){tplActual='libre';return;}
 const def={pbis:[650,1900],pcorr:[750,1900],fijo:[800,1900],barandal:[1000,1000]}[k];
 if(!conservar){$('ancho').value=def[0];$('alto').value=def[1];}
 const o=genTpl(k,+$('ancho').value,+$('alto').value);
 $('perf').value=o.perf.join('\n');$('mues').value=o.mues.join('\n');
 $('obs').value=o.obs;$('herr').value=o.herr;tplActual=k;
}
function datos(){
 const W=+$('ancho').value||1,H=+$('alto').value||1;
 const perf=$('perf').value.split('\n').map(l=>l.trim()).filter(Boolean)
  .map(l=>l.split(/[,;\s]+/).map(Number)).filter(a=>a.length>=3&&a.every(n=>!isNaN(n)));
 const mues=[];
 $('mues').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
  const p=l.split(/[,;\s]+/);
  if(p[0].toUpperCase()==='B'&&p.length>=7){
   const ref=p[2].toUpperCase(),dist=+p[3];
   mues.push({t:'B',l:p[1].toUpperCase(),ref,dist,h:+p[4],p:+p[5],r:+p[6]||6,yc:ref==='T'?H-dist:dist});
  }else{
   let i=(p[0].toUpperCase()==='C')?1:0;const c=(p[i]||'').toUpperCase();
   if(['BI','BD','SI','SD'].includes(c)&&!isNaN(+p[i+1])&&!isNaN(+p[i+2]))mues.push({t:'C',c,a:+p[i+1],b:+p[i+2]});
  }
 });
 return{W,H,perf,mues};
}
function contorno(d){
 const{W,H,mues}=d,g=c=>mues.find(m=>m.t==='C'&&m.c===c);
 const bi=g('BI'),bd=g('BD'),si=g('SI'),sd=g('SD');
 const bisD=mues.filter(m=>m.t==='B'&&m.l==='D').sort((a,b)=>a.yc-b.yc);
 const bisI=mues.filter(m=>m.t==='B'&&m.l==='I').sort((a,b)=>b.yc-a.yc);
 const ops=[];let cur;
 const M=p=>{ops.push({t:'M',p});cur=p;},L=p=>{ops.push({t:'L',p});cur=p;},
 A=(p,q,arc)=>{ops.push({t:'A',p,q,arc});cur=p;};
 M(bi?[bi.a,0]:[0,0]);
 L(bd?[W-bd.a,0]:[W,0]); if(bd){L([W-bd.a,bd.b]);L([W,bd.b]);}
 bisD.forEach(m=>{L([W,m.yc-m.h/2]);L([W-m.p+m.r,m.yc-m.h/2]);
  A([W-m.p,m.yc-m.h/2+m.r],[W-m.p,m.yc-m.h/2],{c:[W-m.p+m.r,m.yc-m.h/2+m.r],r:m.r,a1:180,a2:270});
  L([W-m.p,m.yc+m.h/2-m.r]);
  A([W-m.p+m.r,m.yc+m.h/2],[W-m.p,m.yc+m.h/2],{c:[W-m.p+m.r,m.yc+m.h/2-m.r],r:m.r,a1:90,a2:180});
  L([W,m.yc+m.h/2]);});
 L(sd?[W,H-sd.b]:[W,H]); if(sd){L([W-sd.a,H-sd.b]);L([W-sd.a,H]);}
 L(si?[si.a,H]:[0,H]); if(si){L([si.a,H-si.b]);L([0,H-si.b]);}
 bisI.forEach(m=>{L([0,m.yc+m.h/2]);L([m.p-m.r,m.yc+m.h/2]);
  A([m.p,m.yc+m.h/2-m.r],[m.p,m.yc+m.h/2],{c:[m.p-m.r,m.yc+m.h/2-m.r],r:m.r,a1:0,a2:90});
  L([m.p,m.yc-m.h/2+m.r]);
  A([m.p-m.r,m.yc-m.h/2],[m.p,m.yc-m.h/2],{c:[m.p-m.r,m.yc-m.h/2+m.r],r:m.r,a1:270,a2:360});
  L([0,m.yc-m.h/2]);});
 L(bi?[0,bi.b]:[0,0]); if(bi)L([bi.a,bi.b]);
 return ops;
}
function svgPath(ops,s,ox,oy,H){
 const S=p=>[r1(ox+p[0]*s),r1(oy+(H-p[1])*s)];let d='',prev=null;
 ops.forEach(op=>{
  if(op.t==='M'){const q=S(op.p);d+=`M${q[0]} ${q[1]}`;prev=op.p;}
  else if(op.t==='L'){const q=S(op.p);d+=`L${q[0]} ${q[1]}`;prev=op.p;}
  else{const A=prev,B=op.p,Q=op.q,k=0.5523;
   const c1=S([A[0]+k*(Q[0]-A[0]),A[1]+k*(Q[1]-A[1])]),c2=S([B[0]+k*(Q[0]-B[0]),B[1]+k*(Q[1]-B[1])]),bb=S(B);
   d+=`C${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${bb[0]} ${bb[1]}`;prev=B;}
 });
 return d+'Z';
}
function render(){
 const d=datos(),MW=780,MH=490,ox=95,oy=80;
 const s=Math.min((MW-ox-70)/d.W,(MH-oy-80)/d.H),w=d.W*s,h=d.H*s;
 let svg=`<svg viewBox="0 0 ${MW} ${MH}" xmlns="http://www.w3.org/2000/svg">`;
 svg+=`<path d="${svgPath(contorno(d),s,ox,oy,d.H)}" fill="#e3f1fb" stroke="#111" stroke-width="2"/>`;
 svg+=seg(ox,oy-18,ox+w,oy-18)+tick(ox,oy-18)+tick(ox+w,oy-18)+txt(ox+w/2,oy-24,d.W+' mm','middle');
 svg+=seg(ox-18,oy,ox-18,oy+h)+tick(ox-18,oy)+tick(ox-18,oy+h)+txt(ox-26,oy+h/2,d.H+' mm','middle','#111',-90);
 d.perf.forEach(([x,y,di])=>{const cx=r1(ox+x*s),cy=r1(oy+(d.H-y)*s),r=Math.max(2,di*s/2);
  svg+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#c00" stroke-width="1.5"/>`
   +seg(cx-r-5,cy,cx+r+5,cy,'#c00')+seg(cx,cy-r-5,cx,cy+r+5,'#c00')
   +txt(cx+r+6,cy+4,`Ø${di} (${x}, ${y})`,'start','#c00');});
 d.mues.filter(m=>m.t==='B').forEach(m=>{
  const x=m.l==='D'?ox+w+10:ox-10,y=r1(oy+(d.H-m.yc)*s)+4;
  svg+=txt(x,y,`${m.dist}`,m.l==='D'?'start':'end','#c00');});
 d.mues.filter(m=>m.t==='C').forEach(m=>{
